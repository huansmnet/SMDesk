name: Build SMDesk Windows x64

on:
  workflow_dispatch:

  push:
    branches:
      - smdesk-1.2
    paths:
      - "src/**"
      - "libs/**"
      - "flutter/**"
      - "res/**"
      - "branding/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.py"
      - ".github/workflows/smdesk-windows.yml"

permissions:
  contents: read

env:
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  SM_DESK_VERSION: "1.2.0"

jobs:

  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-topmost:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  build-windows-x64:
    name: SMDesk Windows x64
    needs:
      - generate-bridge
      - build-topmost

    runs-on: windows-2022

    steps:

      - name: Export GitHub Actions cache variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout SMDesk source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply SMDesk self-host configuration
        shell: bash
        run: |
          python3 scripts/apply-smdesk-branding.py

          echo "===== SMDesk CONFIG ====="

          grep -nE \
          'APP_NAME|PROD_RENDEZVOUS_SERVER|RENDEZVOUS_SERVERS|RS_PUB_KEY' \
          libs/hbb_common/src/config.rs | head -20

      - name: Restore Flutter Rust bridge
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter
        id: flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Install RustDesk custom Flutter engine
        shell: pwsh
        run: |
          flutter doctor -v
          flutter precache --windows

          Invoke-WebRequest `
            -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip `
            -OutFile windows-x64-release.zip

          Expand-Archive `
            -Path windows-x64-release.zip `
            -DestinationPath windows-x64-release

          $flutterRoot = "${{ steps.flutter.outputs['CACHE-PATH'] }}"

          Write-Host "Flutter Root: $flutterRoot"

          $enginePath = Join-Path `
            $flutterRoot `
            "bin\cache\artifacts\engine\windows-x64-release"

          Copy-Item `
            "windows-x64-release\*" `
            $enginePath `
            -Recurse `
            -Force

      - name: Patch Flutter 3.24.5
        shell: bash
        run: |
          FLUTTER_ROOT="$(dirname "$(dirname "$(which flutter)")")"

          cp \
            .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff \
            "$FLUTTER_ROOT/"

          cd "$FLUTTER_ROOT"

          git apply \
            flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          prefix-key: smdesk-windows-2022

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          if ! "$VCPKG_ROOT/vcpkg" \
              install \
              --triplet x64-windows-static \
              --x-install-root="$VCPKG_ROOT/installed"; then

            echo "===== VCPKG BUILD LOGS ====="

            find "$VCPKG_ROOT/" -name "*.log" | while read -r logfile; do
              echo
              echo "===== $logfile ====="
              cat "$logfile" || true
            done

            exit 1
          fi

      - name: Build SMDesk
        shell: pwsh
        run: |
          python3 .\build.py `
            --portable `
            --flutter `
            --skip-portable-pack `
            --hwcodec `
            --vram

      - name: Verify SMDesk executable
        shell: pwsh
        run: |
          $release = ".\flutter\build\windows\x64\runner\Release"

          Write-Host "===== RELEASE CONTENT ====="

          Get-ChildItem $release

          if (-not (Test-Path "$release\SMDesk.exe")) {
            Write-Error "SMDesk.exe was not generated."
            exit 1
          }

          Write-Host ""
          Write-Host "SMDesk.exe found."

          Get-Item "$release\SMDesk.exe" | Format-List *

      - name: Prepare SMDesk artifact
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path ".\SMDesk-Windows-x64"

          Copy-Item `
            ".\flutter\build\windows\x64\runner\Release\*" `
            ".\SMDesk-Windows-x64\" `
            -Recurse `
            -Force

      - name: Download TopMost helper
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: topmostwindow-artifacts-x64
          path: ./SMDesk-Windows-x64

      - name: Generate SHA256
        shell: pwsh
        run: |
          $hash = Get-FileHash `
            ".\SMDesk-Windows-x64\SMDesk.exe" `
            -Algorithm SHA256

          "$($hash.Hash)  SMDesk.exe" |
            Out-File `
            ".\SMDesk-Windows-x64\SHA256SUM.txt" `
            -Encoding ascii

          Get-Content ".\SMDesk-Windows-x64\SHA256SUM.txt"

      - name: Upload SMDesk Windows x64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: SMDesk-${{ env.SM_DESK_VERSION }}-Windows-x64
          path: ./SMDesk-Windows-x64
          if-no-files-found: error
          retention-days: 30
